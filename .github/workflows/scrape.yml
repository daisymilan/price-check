name: Scrape Philippine Hardware Prices

on:
  schedule:
    # Runs every day at 1:00 AM UTC (9:00 AM PHT)
    - cron: '0 1 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      dry_run:
        description: 'Dry run (no database write)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape:
    name: Scrape all stores
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write   # needed to commit database.json back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scrapers (dry run)
        if: ${{ inputs.dry_run == 'true' }}
        run: npm run scrape:check

      - name: Run scrapers (full)
        if: ${{ inputs.dry_run != 'true' }}
        run: npm run scrape
        env:
          NODE_ENV: production

      - name: Check for database changes
        id: changes
        run: |
          git diff --quiet src/data/database.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated database
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != 'true'
        run: |
          git config --global user.name  "Price Check Bot"
          git config --global user.email "bot@price-check-ph.app"
          git add src/data/database.json
          git commit -m "chore: update product prices [$(date +'%Y-%m-%d')]

          Automated price update from scraper pipeline.
          Ran at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Co-Authored-By: Price Check Bot <bot@price-check-ph.app>"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "No price changes detected. Database is up to date."

      - name: Upload scrape summary
        if: always()
        run: |
          if [ -f src/data/database.json ]; then
            echo "=== DATABASE SUMMARY ==="
            node -e "
              const db = require('./src/data/database.json');
              console.log('Products:', db.metadata.totalProducts);
              console.log('Offers:', db.metadata.totalOffers);
              console.log('Last scraped:', db.lastScraped);
              if (db.metadata.scrapeReports) {
                const live = db.metadata.scrapeReports.filter(r => r.source === 'live').length;
                const seed = db.metadata.scrapeReports.filter(r => r.source === 'seed').length;
                console.log('Live scrapers:', live, '/ Seed fallbacks:', seed);
              }
            "
          fi
